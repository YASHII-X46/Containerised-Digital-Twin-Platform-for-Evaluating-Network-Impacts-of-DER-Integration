# Containerised Digital Twin Platform for Evaluating Network Impacts of DER Integration v5.0 — modular digital-twin stack (any distribution network).
# LINUX CONTAINER deployment (the default). For the full Windows-container
# stack — the only mode where the PSS SINCAL solver is a compose service
# rather than a host-run process — use docker-compose.windows.yml and see
# WINDOWS.md. Docker Desktop runs one container OS at a time, so the two
# compose files are alternatives, never both at once.
#
#   broker             NATS message bus (OpenFMB command/event messages)
#   load-engine        FastAPI — load/PV/BESS/EV profiles; custom load profiles
#   simulation-engine  FastAPI — QSTS orchestration, KPIs, envelopes, DR (solver-agnostic)
#   opendss-solver     NATS module — OpenDSS power flow behind the solver bus contract
#   dr-controller      NATS module — DR strategy and DER control setpoints
#   prosumer-shadow-twins  NATS module — shadow-twin state and DR outcomes
#   ui                 Node.js control panel that drives the pipeline over NATS
#
# Solvers are swappable containers: the simulate request picks one by name
# ("opendss" default). A PSS SINCAL adapter (sincal-solver/) implements the
# same contract but must run where a licensed Windows SINCAL installation
# exists — see the commented note at the bottom of this file.
#
# All containers interconnect over the OpenFMB NATS bus only — the UI drives the
# engines (metadata, networks, custom profiles, generate/simulate) entirely
# through NATS command/event messages; there is no inter-container HTTP. The UI
# keeps its own ./outputs bind mount for UI-owned persisted summaries; engines do
# not depend on a shared file volume.
#
#   docker compose up --build
#   → open http://localhost:3000
#
# Engine HTTP ports (8001/8002) are published only for host-side health/debugging
# and are not used between containers.

services:
  broker:
    # NATS is the OpenFMB message bus (native NATS on 4222, monitoring on 8222).
    image: nats:2
    container_name: dt-broker
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./broker/nats.conf:/etc/nats/nats.conf:ro

  load-engine:
    build: ./load-engine
    container_name: dt-load-engine
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    environment:
      - BUS_TRANSPORT=nats
      - NATS_URL=nats://broker:4222
      - CUSTOM_PROFILES_DIR=/app/data/custom_profiles
      # Drop-in extensions, off by default. To add custom DER plugins / archetypes
      # / weather providers without rebuilding, mount a directory of *.py files
      # (each calling the relevant register()) and point DER_PLUGINS_DIR at it:
      #   - DER_PLUGINS_DIR=/app/plugins
      # or list importable modules:  - DER_PLUGIN_MODULES=myco.heatpump,myco.electrolyser
      # volumes:
      #   - ./plugins:/app/plugins:ro
    depends_on:
      broker:
        condition: service_started
    # Recover if the process exits (e.g. the broker bounces and drops the bus).
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "8001:8001"

  opendss-solver:
    # Standalone power-flow solver: the Simulation Engine drives it over the
    # solver bus contract (build/solve/read/reset/teardown). Swapping solvers
    # means running a different container that speaks the same contract.
    build: ./opendss-solver
    container_name: dt-opendss-solver
    environment:
      - BUS_TRANSPORT=nats
      - NATS_URL=nats://broker:4222
      - BUS_PREFIX=openfmb
      - DSS_DIR=/app/dss_work
    depends_on:
      broker:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/service.ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  simulation-engine:
    build: ./simulation-engine
    container_name: dt-sim-engine
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002
    environment:
      - BUS_TRANSPORT=nats
      - NATS_URL=nats://broker:4222
      - PROFILES_DIR=/app/data/profiles
      - NETWORKS_DIR=/app/data/networks
    # Wait until the solver, DR controller, and prosumer twins are bus-ready
    # (not just started) so simulate/coordinated runs can reach them immediately.
    depends_on:
      broker:
        condition: service_started
      opendss-solver:
        condition: service_healthy
      dr-controller:
        condition: service_healthy
      prosumer-shadow-twins:
        condition: service_healthy
    # Recover if the process exits (e.g. the broker bounces and drops the bus).
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "8002:8002"

  dr-controller:
    build: ./dr-controller
    container_name: dt-dr-controller
    environment:
      - BUS_TRANSPORT=nats
      - NATS_URL=nats://broker:4222
      - BUS_PREFIX=openfmb
    depends_on:
      broker:
        condition: service_started
    restart: on-failure
    # Healthy once the bus participant has connected and subscribed (main()
    # writes the readiness marker after participant.start()).
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/service.ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  prosumer-shadow-twins:
    build: ./prosumer-shadow-twins
    container_name: dt-prosumer-shadow-twins
    environment:
      - BUS_TRANSPORT=nats
      - NATS_URL=nats://broker:4222
      - BUS_PREFIX=openfmb
    depends_on:
      broker:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/service.ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  ui:
    build: ./ui
    container_name: dt-ui
    environment:
      - PORT=3000
      - NATS_URL=nats://broker:4222
      - BUS_PREFIX=openfmb
      - OUTPUTS_DIR=/app/outputs
    # Wait until both engines are serving before exposing the control panel.
    depends_on:
      broker:
        condition: service_started
      load-engine:
        condition: service_healthy
      simulation-engine:
        condition: service_healthy
    ports:
      # Host port 3001 (another local app commonly occupies 3000); the
      # container-internal port stays 3000.
      - "3001:3000"
    volumes:
      - ./outputs:/app/outputs
      # Live-edit the UI without rebuilding the image (refresh browser for
      # static changes; `docker compose restart ui` after server.js changes).
      - ./ui/public:/app/public:ro
      - ./ui/server.js:/app/server.js:ro
      - ./ui/bus.js:/app/bus.js:ro

# sincal-solver (PSS SINCAL adapter) is NOT part of this compose file: SINCAL
# is licensed, Windows-only software, so the adapter must run where SINCAL is
# installed — either directly on the Windows host:
#     cd sincal-solver && pip install -r requirements.txt
#     set NATS_URL=nats://localhost:4222 && python -m sincal_solver.main
# or as a Windows container (see sincal-solver/Dockerfile.windows). Once it is
# on the bus, select it per run with "solver": "sincal" in the simulate request.
